# This file is used by the dorny/paths-filter action to figure out if a program or
# client has changed and thus if it should be built or tested. Any changes in the
# files listed below will trigger the appropriate workflow for that program or client.

# Programs.

program_common: &program_common
  - ".github/workflows/main.yml"
  - ".github/file-filters.yml"
  - ".github/programs.json"
  - ".github/.env"
  - "configs/scripts/program/**"

mpl_core_program: &mpl_core_program
  - *program_common
  - "programs/mpl-core/**"
  # The program's Mollusk tests use the Rust client as a path dev-dependency
  # for its generated instruction builders, so a regenerated client must
  # re-run the program tests and coverage.
  - "clients/rust/src/**"
  - "clients/rust/Cargo.toml"

programs: &programs
  - *mpl_core_program

# Clients.

client_common: &client_common
  - *programs
  - ".github/workflows/main.yml"
  - ".github/file-filters.yml"
  - ".github/programs.json"
  - ".github/.env"
  - "configs/scripts/client/**"
  - "configs/shank.cjs"
  - "configs/kinobi.cjs"

js_client: &js_client
  - *client_common
  - "clients/js/**"

rust_client: &rust_client
  - *client_common
  - "clients/rust/**"

clients: &clients
  - *js_client
  - *rust_client

# Any.

any: &any
  - *programs
  - *clients
