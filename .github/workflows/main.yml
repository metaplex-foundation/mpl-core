name: Main

# Thin orchestrator over the shared workflows in metaplex-foundation/actions.
# Repository facts live in .github/.env (toolchain pins), .github/programs.json
# (program descriptors) and .github/file-filters.yml (change detection).

on:
  push:
    branches: [main, jun-2024-feature-staging]
  pull_request:
    # Stacked pull requests target the branch below them in the stack rather
    # than a long-lived branch, so restricting this to `main` would leave every
    # PR in a stack with no CI at all. Any PR that targets a development branch
    # gets the same checks as one targeting `main`.
    branches: [main, jun-2024-feature-staging, 'claude/**']

permissions: {}

jobs:
  changes:
    name: Detect changes
    uses: metaplex-foundation/actions/.github/workflows/detect-changes.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read
      pull-requests: read

  build_programs:
    name: Programs
    if: needs.changes.outputs.any == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read

  test_programs:
    name: Programs
    if: needs.changes.outputs.programs == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/test-programs.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read
    with:
      program_matrix: ${{ needs.changes.outputs.program_matrix }}
      apt_packages: protobuf-compiler
      sbf_tools_version: 4.0.0

  coverage:
    name: Programs
    if: needs.changes.outputs.programs == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/coverage.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read
      pull-requests: write
    with:
      program_matrix: ${{ needs.changes.outputs.program_matrix }}
      apt_packages: protobuf-compiler

  generate_clients:
    name: Generate clients
    if: needs.changes.outputs.any == 'true'
    needs: [changes, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/generate-clients.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read

  test_js:
    name: JS Client
    if: needs.changes.outputs.js_client == 'true'
    needs: [changes, generate_clients]
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read

  benchmark:
    name: Benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generate_clients
    uses: metaplex-foundation/actions/.github/workflows/benchmark.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    with:
      mode: store

  benchmark_summary:
    name: Benchmark Summary
    if: github.event_name == 'pull_request'
    needs: generate_clients
    uses: metaplex-foundation/actions/.github/workflows/benchmark.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    with:
      mode: summary

  build_rust_client:
    name: Rust Client
    if: needs.changes.outputs.rust_client == 'true'
    needs: [changes, generate_clients]
    uses: metaplex-foundation/actions/.github/workflows/build-rust-client.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read
    with:
      apt_packages: protobuf-compiler

  test_rust_client:
    name: Rust Client
    if: needs.changes.outputs.rust_client == 'true'
    needs: [changes, generate_clients]
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@8f4db07ffb2abc0ac10bbe94f5dc623eb2218641 # v2.0.0
    permissions:
      contents: read
    with:
      apt_packages: protobuf-compiler
      sbf_tools_version: 4.0.0
