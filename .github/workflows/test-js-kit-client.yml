name: Test Kit client

on:
  workflow_call:
    inputs:
      git_ref:
        type: string

permissions:
  contents: read

env:
  CACHE: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        run: cat .github/.env >> $GITHUB_ENV

      - name: Sanitize Ref
        env:
          GIT_REF: ${{ inputs.git_ref }}
        id: sanitize
        shell: bash
        run: |
          REF="$GIT_REF"
          if [ -z "$REF" ]; then
            REF="default"
          fi
          SANITIZED=${REF//\//-}
          echo "sanitized=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Start validator
        uses: metaplex-foundation/actions/start-validator@v1
        with:
          artifacts: program-builds-${{ steps.sanitize.outputs.sanitized }}
          cache: ${{ env.CACHE }}
          node: ${{ matrix.node }}
          solana: ${{ env.SOLANA_VERSION }}

      - name: Install dependencies
        uses: metaplex-foundation/actions/install-node-dependencies@v1
        with:
          cache: ${{ env.CACHE }}
          folder: ./clients/js-kit
          key: clients-js-kit

      - name: Build
        working-directory: ./clients/js-kit
        run: pnpm build

      - name: Format
        working-directory: ./clients/js-kit
        run: pnpm format

      - name: Lint
        working-directory: ./clients/js-kit
        run: pnpm lint

      - name: Test codecs and generation
        working-directory: ./clients/js-kit
        run: pnpm test

      - name: Test package consumption
        working-directory: ./clients/js-kit
        run: pnpm test:package

      - name: Test program integration
        working-directory: ./clients/js-kit
        run: pnpm test:integration
